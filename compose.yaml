# Local development database. `pnpm db:up` builds our image and starts it.
services:
  postgres:
    build: infra/postgres
    environment:
      POSTGRES_PASSWORD: postgres
      HOMELIBRA_OWNER_PASSWORD: owner
      HOMELIBRA_APP_PASSWORD: app
      HOMELIBRA_DATABASES: homelibra homelibra_test
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 keeps its data under /var/lib/postgresql/18; a major
      # upgrade needs a fresh volume and a dump, so the name carries it.
      - pgdata-18:/var/lib/postgresql

volumes:
  pgdata-18:
