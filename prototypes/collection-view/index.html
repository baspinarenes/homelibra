<!--
  PROTOTYPE — atılacak kod. Ticket: baspinarenes/homelibra#12 "Prototype: Collection görünümü ve Markdown kopya".
  Soru: "İttihat ve Terakki" dosyası açıldığında ekran nasıl görünür ve Markdown kopyası nasıl çıkar?
  Üç ekran varyantı, alttaki çubuktan (veya ← → tuşlarıyla) değişir; ?variant=A|B|C ile açılır.
    A  Okuma sayfası     Tek sütun, belge gibi; Source başlıkları, Locator kenar boşluğunda. Kopya önizleme penceresinde.
    B  İki panel         Solda dosyalar + Source içindekiler + tanım; sağda kartlar, Source başına kopya.
    C  Sıkı liste        (1. turda: Yan yana kopya) Solda sıkı satırlar, sağda canlı Markdown; satırın üstüne gelince karşılığı vurgulanır.
                         Enes'in seçtiği varyant. 2. tur: tek biçim (1 · Kaynak başlıklı), seçenek yok, kopya yalnızca dosyanın tamamı.
                         3. tur: Markdown paneli/sekmesi kalktı; tek sütun liste, "Markdown olarak kopyala" üst çubukta, önizlemesiz.
  Markdown biçimi ekrandan bağımsız seçilir (?format=1|2|3): 1 Kaynak başlıklı, 2 Not başına künye, 3 Madde listesi.
  Kurallar: Collection = etiketlerden herhangi biri (OR) + "etiketli kaynakların tüm notları" (varsayılan açık, ADR-0003);
  Source grupları Tarih sırasıyla (Tarih'siz sonda, alfabetik); Source içinde Locator sırası (boş başta, sayısız sonda);
  geçici arama yalnızca Excerpt/Comment'te, #16'nın basitleştirilmiş hali (katlama + birebir/3+ harf önek, -kelime hariç; kök yok).
  Kopya yalnızca görünen notları alır. Kalıcılık yok: her şey bellekte. Çalıştırma: dosyayı tarayıcıda aç.
-->

/* ---------- shared controls ---------- */

.mdopts { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 18px; }

  { id: "n16", src: "s7", loc: "s. 211", ex: "Üçüncü Ordu'daki genç zabitlerin cemiyete katılımı 1907 baharında hızlandı.", co: "Ersoy'un sayıları DH.MKT ile tutuyor mu?", tags: ["İttihat ve Terakki", "1908"] },

].map((n, i) => ({ ...n, at: i }));
const SEED_COLLECTIONS = [
  { id: "c1", name: "İttihat ve Terakki", tags: ["İttihat ve Terakki", "1908", "Selanik"], includeSources: true },
  { id: "c2", name: "Meşrutiyet basını", tags: ["basın"], includeSources: true },
  { id: "c3", name: "Yeni dosya", tags: [], includeSources: true },
];
const SRC = Object.fromEntries(SOURCES.map((s) => [s.id, s]));
const ALL_TAGS = [...new Set([...SOURCES, ...NOTES].flatMap((x) => x.tags))];

const VARIANTS = [
  { key: "A", name: "Okuma sayfası" },
  { key: "B", name: "İki panel" },
  { key: "C", name: "Sıkı liste" },
];
const FORMATS = [
  { key: "1", name: "Kaynak başlıklı" },
  { key: "2", name: "Not başına künye" },
  { key: "3", name: "Madde listesi" },
];

// ---------- rules ----------
// Tag identity (#3): Turkish case + spacing fold only.
const tagKey = (t) => t.trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
const hasTag = (list, t) => list.some((x) => tagKey(x) === tagKey(t));
// Search fold (ADR-0005, simplified): Turkish case, İ/I/ı→i, diacritics and transcription marks off, ayn/hemze/apostrophe deleted, final b/d→p/t.
const fold = (s) => s.toLocaleLowerCase("tr").replace(/[ʿʾ'’]/g, "").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/b\b/g, "p").replace(/d\b/g, "t");
const words = (s) => fold(s).split(/[^a-z0-9]+/).filter(Boolean);
function parseQuery(q) {
  const toks = q.trim().split(/\s+/).filter(Boolean);
  return {
    pos: toks.filter((t) => !t.startsWith("-")).flatMap(words),
    neg: toks.filter((t) => t.startsWith("-") && t.length > 1).flatMap((t) => words(t.slice(1))),
  };
}
const wordHit = (w, q) => w === q || (q.length >= 3 && w.startsWith(q));
function matchesQuery(note, pq) {
  if (!pq.pos.length && !pq.neg.length) return true;
  const ws = words(note.ex + " " + note.co);
  return pq.pos.every((q) => ws.some((w) => wordHit(w, q))) && !pq.neg.some((q) => ws.some((w) => wordHit(w, q)));
}
// Locator order (#2): empty first, then by the numbers in the text, number-less last in capture order.
function locKey(n) {
  if (!n.loc.trim()) return [0];
  const nums = (n.loc.match(/\d+/g) || []).map(Number);
  return nums.length ? [1, ...nums] : [2, n.at];
}
function cmpArr(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] ?? -1, y = b[i] ?? -1;
    if (x !== y) return x - y;
  }
  return 0;
}
// Source order (#3): by date, then author, then title; undated last, alphabetical.
function cmpSrc(a, b) {
  if (a.sort == null && b.sort != null) return 1;
  if (b.sort == null && a.sort != null) return -1;
  if (a.sort != null && a.sort !== b.sort) return a.sort - b.sort;
  return (a.author + a.title).localeCompare(b.author + b.title, "tr");
}

// Collection membership (ADR-0003): own tag OR (option on AND source tag). Returns groups of visible notes.
function compute(coll, query) {
  const pq = parseQuery(query);
  const members = [], bySourceOnly = [];
  for (const n of NOTES) {
    const s = SRC[n.src];
    const own = n.tags.filter((t) => hasTag(coll.tags, t));
    const via = s.tags.filter((t) => hasTag(coll.tags, t));
    if (!own.length && via.length && !coll.includeSources) bySourceOnly.push(n);
    if (!own.length && !(coll.includeSources && via.length)) continue;
    members.push({ ...n, own, via: coll.includeSources ? via : [] });
  }
  const visible = members.filter((n) => matchesQuery(n, pq));
  const groups = [];
  for (const s of [...SOURCES].sort(cmpSrc)) {
    const ns = visible.filter((n) => n.src === s.id).sort((a, b) => cmpArr(locKey(a), locKey(b)));
    if (ns.length) groups.push({ source: s, notes: ns });
  }
  const viaOnly = members.filter((n) => !n.own.length).length;
  return { groups, total: members.length, shown: visible.length, viaOnly, wouldAdd: bySourceOnly.length, pq };
}

// ---------- markdown ----------
const srcDate = (s, o) => s.date ? s.date + (o.firstEd && s.firstEd ? ` [ilk baskı ${s.firstEd}]` : "") : "";
const join = (...xs) => xs.filter(Boolean).join(", ");
const quote = (t) => t.split("\n").map((l) => "> " + l).join("\n");
// Each block carries the note id so the side-by-side variant can light up the lines that came from a row.
function toMarkdown(coll, groups, fmt, o) {
  const blocks = [];
  const push = (text, id) => blocks.push({ text, id });
  push(`# ${coll.name}\n`);
  for (const { source: s, notes } of groups) {
    const d = srcDate(s, o);
    if (fmt === "1") {
      push(`## ${join(s.author, s.title)}${d ? ` (${d})` : ""}\n`);
      for (const n of notes) {
        const parts = [];
        if (n.loc) parts.push(`**${n.loc}**`);
        if (n.ex) parts.push(quote(n.ex));
        if (n.co && o.comments) parts.push(n.co);
        if (n.ex || (n.co && o.comments)) push(parts.join("\n\n") + "\n", n.id);
      }
    } else if (fmt === "2") {
      for (const n of notes) {
        const cite = join(s.author, s.title + (d ? ` (${d})` : ""), n.loc);
        if (n.ex) push(quote(n.ex) + `\n>\n> — ${cite}` + (n.co && o.comments ? `\n\n${n.co}` : "") + "\n", n.id);
        else if (n.co && o.comments) push(`${n.co} (${cite})\n`, n.id);
      }
    } else {
      push(`### ${s.author ? s.author + " — " : ""}${s.title}${d ? ` (${d})` : ""}\n`);
      const lines = [];
      for (const n of notes) {
        const body = [n.ex && `"${n.ex}"`, n.co && o.comments && `*${n.co}*`].filter(Boolean).join(" — ");
        if (body) lines.push({ text: `- ${n.loc ? `**${n.loc}** · ` : ""}${body}`, id: n.id });
      }
      lines.forEach((l, i) => push(l.text + (i === lines.length - 1 ? "\n" : ""), l.id));
    }
  }
  return blocks;
}
const mdText = (blocks) => blocks.map((b) => b.text).join("\n").trim() + "\n";

function copyText(text) {
  // Written synchronously in the click handler (web clipboard rule from #7).
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  return Promise.resolve();
}

// ---------- shared pieces ----------
function Hl({ text, pq }) {
  if (!pq.pos.length) return text;
  return text.split(/(\s+)/).map((tok, i) => {
    const ws = words(tok);
    return ws.length && ws.some((w) => pq.pos.some((q) => wordHit(w, q))) ? html`<mark key=${i}>${tok}</mark>` : tok;
  });
}

function Reason({ n }) {
  return html`<span className="reason">
    ${n.own.length ? n.own.join(", ") : null}
    ${n.own.length && n.via.length ? " · " : null}
    ${n.via.length && !n.own.length ? html`<span className="src" title="Not etiketsiz; kaynağın etiketiyle geldi">kaynak: ${n.via.join(", ")}</span>` : null}
  </span>`;
}

function TagEditor({ coll, update }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const sugg = useMemo(() => {
    const f = fold(q.trim());
    return ALL_TAGS.filter((t) => !hasTag(coll.tags, t) && (!f || fold(t).includes(f)));
  }, [q, coll.tags]);
  const add = (t) => { if (t.trim() && !hasTag(coll.tags, t)) update({ tags: [...coll.tags, t.trim()] }); setQ(""); setOpen(false); };
  return html`<div className="tags">
    ${coll.tags.map((t) => html`<span className="tagchip" key=${t}>${t}<button aria-label=${t + " etiketini çıkar"} onClick=${() => update({ tags: coll.tags.filter((x) => x !== t) })}>×</button></span>`)}
    <div className="addtag">
      <input placeholder="+ etiket" value=${q} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 150)}
        onChange=${(e) => setQ(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && add(sugg[0] || q)} />
      ${open && sugg.length ? html`<ul>${sugg.map((t) => html`<li key=${t}><button onMouseDown=${() => add(t)}>${t}</button></li>`)}</ul>` : null}
    </div>
  </div>`;
}

function MdPre({ blocks, hot }) {

function CopyDialog({ title, blocks, count, fmt, setFmt, opts, setOpts, onClose, onCopied }) {

}

// ---------- prototype chrome ----------
function Switcher({ variant, setVariant, showState, setShowState }) {
  const i = VARIANTS.findIndex((v) => v.key === variant);
  const go = (d) => setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  return html`<nav className="switcher" aria-label="Varyant">
    <button onClick=${() => go(-1)} aria-label="Önceki varyant">‹</button>
    <span className="lab"><b>${variant}</b><span className="full"> · ${VARIANTS[i].name}</span></span>
    <button onClick=${() => go(1)} aria-label="Sonraki varyant">›</button>
    <button className="txt" aria-pressed=${showState} onClick=${() => setShowState(!showState)}>durum</button>
  </nav>`;
}

function param(name, allowed, dflt) {
  const v = (new URLSearchParams(location.search).get(name) || "").toUpperCase();
  return allowed.includes(v) ? v : dflt;
}
function setParam(name, v) {
  const u = new URL(location.href);
  u.searchParams.set(name, v);
  history.replaceState(null, "", u);
}

function App() {
  const [variant, setVariantS] = useState(() => param("variant", VARIANTS.map((v) => v.key), "C"));
  const [fmt, setFmtS] = useState(() => param("format", FORMATS.map((f) => f.key), "1"));
  const [opts, setOpts] = useState({ comments: true, firstEd: false });
  const [colls, setColls] = useState(SEED_COLLECTIONS);
  const [collId, setCollId] = useState("c1");
  const [query, setQuery] = useState("");
  const [copyFor, setCopyFor] = useState(undefined); // undefined = closed, null = whole collection, id = one source
  const [toast, setToast] = useState(null);
  const [showState, setShowState] = useState(false);

  const setVariant = (v) => { setVariantS(v); setParam("variant", v); };
  const setFmt = (f) => { setFmtS(f); setParam("format", f); };
  const coll = colls.find((c) => c.id === collId);
  const update = (patch) => setColls((cs) => cs.map((c) => c.id === collId ? { ...c, ...patch } : c));
  // Search is temporary: switching collection clears it.
  const pickColl = (id) => { setCollId(id); setQuery(""); };
  const r = useMemo(() => compute(coll, query), [coll, query]);
  const all = useMemo(() => Object.fromEntries(colls.map((c) => [c.id, compute(c, "").total])), [colls]);

  const copyGroups = copyFor ? r.groups.filter((g) => g.source.id === copyFor) : r.groups;
  const blocks = useMemo(() => copyFor === undefined ? [] : toMarkdown(coll, copyGroups, fmt, opts), [copyFor, coll, r, fmt, opts]);
  const onCopied = (n) => { setToast(`Kopyalandı · ${n} not`); setTimeout(() => setToast(null), 1800); };

  const props = { coll, colls, setCollId: pickColl, update, query, setQuery, r, all, openCopy: setCopyFor, fmt, setFmt, opts, setOpts, onCopied };
  const V = { A: VariantA, B: VariantB, C: VariantC }[variant];

  const state = {
    dosya: { ad: coll.name, etiketler: coll.tags, "etiketli kaynakların tüm notları": coll.includeSources },
    arama: query || "(yok)",
    görünen: `${r.shown} / ${r.total} not, ${r.groups.length} kaynak`,
    "kaynak etiketiyle gelen": r.viaOnly,
    sıra: r.groups.map((g) => `${g.source.date || "tarihsiz"} · ${g.source.title} → ${g.notes.map((n) => n.loc || "∅").join(" | ")}`),
    markdown: { biçim: FORMATS.find((f) => f.key === fmt).name, ...opts },
  };

  return html`
    <${V} ...${props} />
    ${copyFor !== undefined ? html`<${CopyDialog} title=${copyFor ? "Kaynağı Markdown olarak kopyala" : "Dosyayı Markdown olarak kopyala"}
      blocks=${blocks} count=${copyGroups.reduce((a, g) => a + g.notes.length, 0)}
      fmt=${fmt} setFmt=${setFmt} opts=${opts} setOpts=${setOpts} onClose=${() => setCopyFor(undefined)} onCopied=${onCopied} />` : null}
    ${toast ? html`<div className="toast">${toast}</div>` : null}
    ${showState ? html`<div className="statepanel">${JSON.stringify(state, null, 2)}</div>` : null}
    <${Switcher} variant=${variant} setVariant=${setVariant} showState=${showState} setShowState=${setShowState} />
  `;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</html>
