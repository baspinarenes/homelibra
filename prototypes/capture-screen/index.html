  PROTOTYPE — atılacak kod. Ticket: baspinarenes/homelibra#11 "Prototype: mobil Capture ekranı".
  Soru: okurken on saniyede Note girmek nasıl görünür ve davranır?
  Üç varyant, alttaki çubuktan (veya ← → tuşlarıyla) değişir; ?variant=A|B|C ya da #A|#B|#C ile açılır.
    A  Tek ekran form      Kaynak → Konum → Alıntı → Yorum, hepsi tek ekranda, Kaydet altta sabit.
    B  Önce konum          Adım 1 sayı tuş takımıyla Konum, adım 2 Alıntı/Yorum sekmeleri.
    C  Not akışı           Kaynağın notları sohbet gibi akar; altta tek yazma kutusu, Alıntı/Yorum modu.
                           Enes'in seçtiği varyant. 2. tur: konum tuş takımı + "hâlâ burada mı?", etiket seçici,
                           yorum birleşince "Geri al", büyüyen/tam ekran yazma kutusu, nota dokununca düzenleme.
  Kalıcılık yok: her şey bellekte. Çevrimdışı kuyruk sağdaki panelden taklit edilir.
  Çalıştırma: dosyayı tarayıcıda aç.
-->

function ago(t) {
  const m = Math.round((Date.now() - t) / MIN);
  if (m < 1) return "şimdi";
  if (m < 60) return m + " dk önce";
  if (m < 60 * 24) return Math.round(m / 60) + " sa önce";
  return Math.round(m / 1440) + " gün önce";
}
const SYNC_LABEL = { synced: "eşitlendi", queued: "kuyrukta", sending: "gönderiliyor" };
const parseTags = (s) => s.split(/[,\s]+/).map((t) => t.replace(/^#/, "").trim()).filter(Boolean);

// ---------- store ----------
function useStore() {
  const [sources, setSources] = useState(SEED_SOURCES);
  const [notes, setNotes] = useState(SEED_NOTES);
  const [online, setOnline] = useState(true);
  const onlineRef = useRef(online);
  onlineRef.current = online;

  const ack = (ids) => setTimeout(() => {
    if (!onlineRef.current) return setNotes((ns) => ns.map((n) => ids.includes(n.id) && n.sync === "sending" ? { ...n, sync: "queued" } : n));
    setNotes((ns) => ns.map((n) => ids.includes(n.id) ? { ...n, sync: "synced" } : n));
  }, 1100);

  useEffect(() => {
    if (!online) return;
    const ids = notes.filter((n) => n.sync === "queued").map((n) => n.id);
    if (!ids.length) return;
    setNotes((ns) => ns.map((n) => ids.includes(n.id) ? { ...n, sync: "sending" } : n));
    ack(ids);
  }, [online]);

  const addNote = (n) => {
    const note = { id: "n" + Math.random().toString(36).slice(2, 7), at: Date.now(), tags: [], excerpt: "", comment: "", ...n, sync: online ? "sending" : "queued" };
    setNotes((ns) => [...ns, note]);
    if (online) ack([note.id]);
    return note;
  };
  const patchNote = (id, patch) => {
    setNotes((ns) => ns.map((n) => n.id === id ? { ...n, ...patch, sync: online ? "sending" : "queued" } : n));
    if (online) ack([id]);
  };
  const addSource = (s) => {
    const src = { id: "s" + Math.random().toString(36).slice(2, 7), author: "", status: "okunuyor", ...s };
    setSources((ss) => [...ss, src]);
    return src;
  };
  const lastNoteOf = (sourceId) => notes.filter((n) => n.sourceId === sourceId).sort((a, b) => b.at - a.at)[0];
  const lastAt = (sourceId) => lastNoteOf(sourceId)?.at ?? 0;
  // "Şu an okuduğum": the Reading source with the most recent note.
  const currentDefault = () => [...sources].filter((s) => s.status === "okunuyor").sort((a, b) => lastAt(b.id) - lastAt(a.id))[0];
  const queued = notes.filter((n) => n.sync !== "synced").length;
  return { sources, notes, online, setOnline, addNote, patchNote, addSource, lastNoteOf, lastAt, currentDefault, queued };
}

  if (store.queued) return html`<span className="queue ok">Gönderiliyor…</span>`;
  return null;
}

function useToast() {
  const [msg, setMsg] = useState(null);
  const t = useRef();
  const show = (text, action) => { setMsg({ text, action }); clearTimeout(t.current); t.current = setTimeout(() => setMsg(null), action ? 5000 : 1800); };
  return [msg && html`<div className=${"toast" + (msg.action ? " act" : "")} role="status">${msg.text}
    ${msg.action && html`<button onClick=${() => { msg.action.fn(); setMsg(null); }}>${msg.action.label}</button>`}</div>`, show];
}

const tagCounts = (store) => {
  const c = {};
  store.notes.forEach((n) => n.tags.forEach((t) => (c[t] = (c[t] || 0) + 1)));
  return Object.keys(c).sort((a, b) => c[b] - c[a]);
};

function TagPicker({ store, value, onChange }) {
  const [q, setQ] = useState("");
  const norm = (s) => s.trim().replace(/^#/, "").toLocaleLowerCase("tr");
  const known = tagCounts(store);
  const add = (t) => { t = norm(t); if (t && !value.includes(t)) onChange([...value, t]); setQ(""); };
  const sugg = known.filter((t) => !value.includes(t) && t.includes(norm(q))).slice(0, 12);
  const isNew = norm(q) && !known.includes(norm(q)) && !value.includes(norm(q));
  return html`<div className="tagpicker">
    <div className="chips">
      ${value.length
        ? value.map((t) => html`<button key=${t} className="chip on" onClick=${() => onChange(value.filter((x) => x !== t))} aria-label=${t + " etiketini kaldır"}>${t} ×</button>`)
        : html`<span className="hint">Etiket yok; etiketsiz de kaydedilir.</span>`}
    </div>
    <input id="tag-q" placeholder="Etiket ara ya da yeni yaz" value=${q} onChange=${(e) => setQ(e.target.value)}
      onKeyDown=${(e) => { if (e.key === "Enter") { e.preventDefault(); add(q); } }} />
    <div className="chips">
      ${isNew && html`<button className="chip new" onClick=${() => add(q)}>+ “${norm(q)}” yeni etiket</button>`}
      ${sugg.map((t) => html`<button key=${t} className="chip" onClick=${() => add(t)}>${t}</button>`)}
    </div>
  </div>`;
}

  const notes = store.notes.filter((n) => n.sourceId === currentId).sort((a, b) => a.at - b.at);
  const last = notes[notes.length - 1];
  const now = () => Date.now() + tweaks.skew;
  const [loc, setLoc] = useState(last?.locator ?? "");
  const [locAt, setLocAt] = useState(last?.at ?? now());
  const [mode, setMode] = useState("ex");
  const [text, setText] = useState("");
  const [tags, setTags] = useState([]);
  const [expanded, setExpanded] = useState(false);
  const [noMerge, setNoMerge] = useState(false);
  const [sheet, setSheet] = useState(null); // "source" | "loc" | "tags" | note id
  const [freshId, setFreshId] = useState(null);
  const [, tick] = useState(0);
  const [toast, showToast] = useToast();
  const taRef = useRef(), feedRef = useRef();
  useEffect(() => { const i = setInterval(() => tick((x) => x + 1), 10000); return () => clearInterval(i); }, []);
  useEffect(() => { const l = store.lastNoteOf(currentId); setLoc(l?.locator ?? ""); setLocAt(l?.at ?? now()); setFreshId(null); }, [currentId]);
  useEffect(() => { feedRef.current && (feedRef.current.scrollTop = feedRef.current.scrollHeight); }, [notes.length, currentId]);
  useEffect(() => { taRef.current?.focus(); }, [mode, currentId]);
  useEffect(() => {
    const ta = taRef.current;
    if (!ta) return;
    if (expanded) { ta.style.height = ""; return; }
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight + 2, 220) + "px";
  }, [text, expanded, mode]);

  const stale = loc && now() - locAt > STALE_AFTER;
  // A comment typed right after an excerpt at the same locator joins that note.
  const mergeTarget = tweaks.cMerge && mode === "co" && !noMerge && last && last.id === freshId && last.excerpt && !last.comment && last.locator === loc ? last : null;
  const send = () => {
    const body = text.trim();
    if (!body) return;
    if (mergeTarget) {
      const before = { comment: mergeTarget.comment, tags: mergeTarget.tags };
      store.patchNote(mergeTarget.id, { comment: body, tags: [...new Set([...mergeTarget.tags, ...tags])] });
      showToast("Yorum alıntıya eklendi", { label: "Geri al", fn: () => {
        store.patchNote(mergeTarget.id, before);
        setText(body); setNoMerge(true); setMode("co");
      } });
    } else {
      const n = store.addNote({ sourceId: currentId, locator: loc.trim(), [mode === "ex" ? "excerpt" : "comment"]: body, tags });
      setFreshId(n.id);
      showToast(`Kaydedildi · ${loc.trim() || "konumsuz"}`);
    }
    timer.stop();
    setText(""); setTags([]); setNoMerge(false); setExpanded(false);
    if (mode === "ex" && tweaks.cAutoComment) setMode("co");
  };
  const openNote = sheet && sheet.startsWith?.("n") ? store.notes.find((n) => n.id === sheet) : null;

  let prevLoc = null;
  return html`<div className=${"vc" + (expanded ? " expanded" : "")} style=${{ display: "contents" }}>
    <div className="appbar">
      <button className="srcbtn" onClick=${() => setSheet("source")}>
        <span className="typechip">${TYPES[src.type].ad} ▾</span><span className="t">${src.title}</span>
      </button>
      <${QueueBadge} store=${store} />
    </div>
    <div className="scroll" ref=${feedRef} hidden=${expanded}><div className="feed">
      ${notes.length === 0 && html`<div className="empty">Bu kaynaktan henüz not yok. Aşağıya yazmaya başla.</div>`}
      ${notes.map((n) => {
        const head = n.locator !== prevLoc ? html`<div className="lochead" key=${n.id + "h"}>${n.locator || "konumsuz"}</div>` : null;
        prevLoc = n.locator;
        return html`<${React.Fragment} key=${n.id}>${head}
          <button className=${"bubble" + (n.id === freshId ? " fresh" : "")} onClick=${() => setSheet(n.id)} aria-label="Notu düzenle">
            ${n.excerpt && html`<span className="ex">${n.excerpt}</span>`}
            ${n.comment && html`<span className="co">${n.comment}</span>`}
            <span className="meta">
              ${n.tags.map((t) => html`<span className="tag" key=${t}>${t}</span>`)}
              <span style=${{ marginLeft: "auto" }}>${ago(n.at)}</span>
              <span className=${"sync " + n.sync}>${SYNC_LABEL[n.sync]}</span>
            </span>
          </button><//>`;
      })}
    </div></div>
    <div className="composer">
      ${mergeTarget && html`<div className="merge">Yorum, ${loc || "konumsuz"} alıntısına eklenecek <button className="ghost" onClick=${() => setNoMerge(true)}>Ayrı not yap</button></div>`}
      <div className="crow">
        <button className=${"lchip" + (loc ? "" : " none") + (stale ? " stale" : "")} onClick=${() => { timer.start(); setSheet("loc"); }}>
          ${loc || "konum ekle"}${stale ? " · hâlâ burada mı?" : ""}
        </button>
        <button className=${"tagbtn" + (tags.length ? " on" : "")} onClick=${() => setSheet("tags")}>
          ${tags.length ? tags.join(", ") : "+ etiket"}
        </button>
        <div className="mode" role="group">
          <button aria-pressed=${mode === "ex"} onClick=${() => setMode("ex")}>Alıntı</button>
          <button aria-pressed=${mode === "co"} onClick=${() => setMode("co")}>Yorum</button>
        </div>
      </div>
      <div className="inrow">
        <textarea id="c-text" ref=${taRef} rows="2" className=${mode === "ex" ? "ex" : ""} value=${text}
          placeholder=${mode === "ex" ? "Alıntı…" : "Yorum…"}
          onChange=${(e) => { timer.start(); setText(e.target.value); }}></textarea>
        <div className="sidebtns">
          <button className="expand" onClick=${() => setExpanded(!expanded)} aria-label=${expanded ? "Küçült" : "Tam ekran yaz"}>${expanded ? "⤡" : "⤢"}</button>
          <button className="send" aria-label="Kaydet" disabled=${!text.trim()} onClick=${send}>↑</button>
        </div>
      </div>
    </div>
    ${toast}
    ${sheet === "source" && html`<${SourceSheet} store=${store} currentId=${currentId} onClose=${() => setSheet(null)} onPick=${(id) => { setCurrentId(id); setSheet(null); }} />`}
    ${sheet === "loc" && html`<${LocatorSheet} src=${src} value=${loc} onClose=${() => setSheet(null)} onDone=${(l) => { setLoc(l); setLocAt(now()); setSheet(null); taRef.current?.focus(); }} />`}
    ${sheet === "tags" && html`<${Sheet} title="Bu notun etiketleri" onClose=${() => setSheet(null)} footer=${html`<button className="primary" onClick=${() => setSheet(null)}>Tamam</button>`}>
      <${TagPicker} store=${store} value=${tags} onChange=${setTags} />
    <//>`}
    ${openNote && html`<${NoteSheet} store=${store} note=${openNote} src=${src} onClose=${() => setSheet(null)} />`}
  </div>`;
}

// ---------- prototype panel ----------
function Panel({ store, variant, currentId, timer, tweaks, setTweaks }) {
  const def = store.currentDefault();
  const cur = store.sources.find((s) => s.id === currentId);
  const recent = [...store.notes].sort((a, b) => b.at - a.at).slice(0, 6);
  const set = (k, v) => setTweaks({ ...tweaks, [k]: v });
  const opt = (k, choices) => html`<div className="radio">${choices.map(([v, l]) => html`<button key=${String(v)} aria-pressed=${tweaks[k] === v} onClick=${() => set(k, v)}>${l}</button>`)}</div>`;
  const secs = timer.last != null ? (timer.last / 1000).toFixed(1).replace(".", ",") : null;
  return html`<aside className="panel">
    <section className="card">
      <p className="q">Okurken on saniyede not girmek nasıl görünmeli?</p>
      <p className="desc">Üç varyantı aynı örnek kütüphaneyle dene. Hangisi elini kitaptan en az ayırıyor, hangi alan sırası doğal geliyor? Örnek kaynak ve notlar kurgusal.</p>
    </section>
    <section>
      <h2>Prototip kontrolleri</h2>
      <div className="card">
        <div className="toggle"><span>İnternet bağlantısı</span>
          <button className="switch" role="switch" aria-checked=${store.online} aria-label="İnternet bağlantısı" onClick=${() => store.setOnline(!store.online)}></button></div>
        ${variant === "A" && html`<div className="toggle"><span>Alan sırası</span>${opt("aOrder", [["loc-first", "Konum → Alıntı"], ["ex-first", "Alıntı → Konum"]])}</div>`}
        ${variant === "C" && html`
          <div className="toggle"><span>Alıntıdan sonra Yorum'a geç</span><button className="switch" role="switch" aria-checked=${tweaks.cAutoComment} aria-label="Alıntıdan sonra Yorum moduna geç" onClick=${() => set("cAutoComment", !tweaks.cAutoComment)}></button></div>
          <div className="toggle"><span>Yorumu son alıntıya ekle</span><button className="switch" role="switch" aria-checked=${tweaks.cMerge} aria-label="Yorumu son alıntıya ekle" onClick=${() => set("cMerge", !tweaks.cMerge)}></button></div>
          <div className="toggle"><span>Konum ${tweaks.skew ? `(+${tweaks.skew / MIN} dk)` : ""}</span><button className="radio-btn" onClick=${() => set("skew", tweaks.skew + 5 * MIN)}>Zamanı 5 dk ileri al</button></div>
          <p className="desc">Konum ${STALE_AFTER / MIN} dakikadır değişmediyse etiketi “hâlâ burada mı?” diye sorar. Bir nota dokununca düzenleme açılır.</p>`}
      </div>
    </section>
    <section>
      <h2>Son kayıt süresi</h2>
      <div className="card">
        <span className=${"timer " + (secs == null ? "" : timer.last <= 10000 ? "good" : "slow")}>${secs == null ? "—" : secs + " sn"}</span>
        <span className="hint">İlk tuştan Kaydet'e kadar. Hedef 10 sn.</span>
      </div>
    </section>
    <section>
      <h2>Durum</h2>
      <div className="card">
        <dl className="kv">
          <dt>Varsayılan kaynak</dt><dd>${def?.title} <span className="hint">(okunuyor, en son not)</span></dd>
          <dt>Seçili kaynak</dt><dd>${cur?.title}</dd>
          <dt>Bağlantı</dt><dd>${store.online ? "çevrimiçi" : "çevrimdışı"}</dd>
          <dt>Gönderim kuyruğu</dt><dd>${store.notes.filter((n) => n.sync === "queued").length} not</dd>
        </dl>
      </div>
    </section>
    <section>
      <h2>Son notlar</h2>
      <div className="card"><ul className="notes">
        ${recent.map((n) => {
          const s = store.sources.find((x) => x.id === n.sourceId);
          return html`<li key=${n.id}>
            <div className="h"><span>${s?.title.slice(0, 30)}${s && s.title.length > 30 ? "…" : ""} · <span className="mono">${n.locator || "konumsuz"}</span></span><span className=${"sync " + n.sync}>${SYNC_LABEL[n.sync]}</span></div>
            ${n.excerpt && html`<div className="ex">“${n.excerpt}”</div>`}
            ${n.comment && html`<div>${n.comment}</div>`}
            <div className="hint">${n.tags.length ? n.tags.map((t) => "#" + t).join(" ") : "etiketsiz"}</div>
          </li>`;
        })}
      </ul></div>
    </section>
  </aside>`;
}

function Switcher({ variant, setVariant }) {
  const i = VARIANTS.findIndex((v) => v.key === variant);
  const go = (d) => setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  return html`<nav className="switcher" aria-label="Varyant">
    <button onClick=${() => go(-1)} aria-label="Önceki varyant">‹</button>
    <span className="lab"><b>${variant}</b><span className="full"> · ${VARIANTS[i].name}</span></span>
    <button onClick=${() => go(1)} aria-label="Sonraki varyant">›</button>
  </nav>`;
}

function initialVariant() {
  const q = new URLSearchParams(location.search).get("variant");
  const h = location.hash.replace("#", "");
  const v = (q || h || "A").toUpperCase();
  return VARIANTS.some((x) => x.key === v) ? v : "A";
}

function App() {
  const store = useStore();
  const [variant, setVariantState] = useState(initialVariant);
  const [currentId, setCurrentId] = useState(() => store.currentDefault().id);
  const [tweaks, setTweaks] = useState({ aOrder: "loc-first", cAutoComment: true, cMerge: true, skew: 0 });
  const t0 = useRef(null);
  const [lastDuration, setLastDuration] = useState(null);
  const timer = {
    start: () => { if (t0.current == null) t0.current = Date.now(); },
    stop: () => { if (t0.current != null) setLastDuration(Date.now() - t0.current); t0.current = null; },
    last: lastDuration,
  };
  const setVariant = (v) => {
    setVariantState(v);
    t0.current = null;
    try { const u = new URL(location.href); u.searchParams.set("variant", v); u.hash = v; history.replaceState(null, "", u); } catch (e) {}
  };
  const V = { A: VariantA, B: VariantB, C: VariantC }[variant];
  return html`<div className="stage">
    <main className="phone" aria-label="Capture ekranı">
      <${V} key=${variant} store=${store} currentId=${currentId} setCurrentId=${setCurrentId} timer=${timer} tweaks=${tweaks} />
    </main>
    <${Panel} store=${store} variant=${variant} currentId=${currentId} timer=${timer} tweaks=${tweaks} setTweaks=${setTweaks} />
    <${Switcher} variant=${variant} setVariant=${setVariant} />
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
