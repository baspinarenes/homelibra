<title>Homelibra Library Gezinme Prototipi</title>
<!--
  PROTOTYPE — atılacak kod. Ticket: baspinarenes/homelibra#35 "Prototype: Library gezinme ekranları (Source listesi, Tag listesi, arama)".
  Soru: Capture ve Organizing pass dışında Library'de nasıl gezinilir, Android'de ve web'de?
  Üç gezinme yapısı, alttaki çubuktan (veya ← → tuşlarıyla) değişir; ?variant=A|B|C, ?device=phone|desktop.
    A  Alt sekmeler   Enes'in seçtiği varyant. 1. tur: Not al · Kaynaklar · Etiketler · Ara; Düzenlenecekler Kaynaklar'ın tepesinde.
                      2. tur: Ana sayfa · Kaynaklar · Etiketler · Dosyalar · Ara (beş sekme). Ana sayfa: en üstte son not alınan Source (kapak + Not al),
                      Düzenlenecekler şeridi, Okunuyor listesi, Etiketler düz liste (son kullanılana göre, boyutla vurgu yok).
                      Source kapakları her listede; yüklenmemişse türe göre şablon ikon. Not al = #11 akışı (yakalama sırası) itilen ekran;
                      Source sayfası Locator sırası, yazma kutusu yok. Telefonda alt çubuk, masaüstünde sol ray; her sekmenin kendi geri yığını.
    B  Ana sayfa      Tek Kütüphane ekranı: üstte arama, altında Düzenlenecekler, Okunuyor, Dosyalar, etiket bulutu. "Not al" yüzen düğme.
                      Source sayfası hem okuma hem Capture: Locator sırası + altta yazma kutusu.
    C  Kenar çubuğu   Üç bölme (kenar · liste · Source). Telefonda çekmece + yığın. Etiketler çoklu seçilir (OR), "Dosya olarak kaydet".
                      Source sayfasında Konum sırası / Yakalama sırası anahtarı + yazma kutusu.
  Ortak ekranlar: Source listesi (Okunuyor/Bitti, sıralama, takvim çipli Tarih filtresi), Source'un notları, Tag listesi → etiket sayfası
  (tek etiketli geçici Collection görünümü, #12 C), Dosyalar, arama sonuçları (Notlar + Kaynaklar, #16), Düzenlenecekler (#13).
  Basitleştirmeler: arama kök kademesi yok (birebir > önek > Source'ta parça); Düzenle modu, not düzenleme, Markdown kopya ve etiket
  yeniden adlandırma birer bildirimle temsil edilir. Kalıcılık yok: her şey bellekte. Çalıştırma: dosyayı tarayıcıda aç.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root {
  --page: #F4F6F7; --surface: #FFFFFF; --line: #D3DADF; --fg: #17212B; --muted: #5B6873;
  --accent: #1E5A6D; --accent-fg: #FFFFFF; --accent-soft: #E2EDF0; --excerpt: #F3F1EC; --comment: #2F4A5A;
  --warn: #8F5200; --warn-soft: #FCEFD9; --mark: #FBE7A1; --bar: #17212B; --bar-fg: #F4F7F8; --desk: #DCE2E6;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-quote: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0C1115; --surface: #161F25; --line: #2B3740; --fg: #E3E9ED; --muted: #93A0AA;
  --accent: #74B4C7; --accent-fg: #0C1115; --accent-soft: #1D3038; --excerpt: #20262A; --comment: #B9CCD6;
  --warn: #F0B45A; --warn-soft: #3A2B14; --mark: #5A4A12; --bar: #E3E9ED; --bar-fg: #0C1115; --desk: #05080A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --page: #0C1115; --surface: #161F25; --line: #2B3740; --fg: #E3E9ED; --muted: #93A0AA;
  --accent: #74B4C7; --accent-fg: #0C1115; --accent-soft: #1D3038; --excerpt: #20262A; --comment: #B9CCD6;
  --warn: #F0B45A; --warn-soft: #3A2B14; --mark: #5A4A12; --bar: #E3E9ED; --bar-fg: #0C1115; --desk: #05080A; color-scheme: dark;
}
html, body { margin: 0; }
body { background: var(--desk); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.muted { color: var(--muted); }
.lbl { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.typechip { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.primary { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; white-space: nowrap; }
.secondary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font-weight: 500; white-space: nowrap; }
.ghost { background: none; border: 0; color: var(--accent); font-weight: 500; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
.ghost:hover { background: var(--accent-soft); }
.iconbtn { background: none; border: 0; width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; color: var(--fg); flex: none; font-size: 20px; }
.iconbtn:hover { background: var(--accent-soft); }
.pill { display: inline-block; font-size: 11.5px; border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.done { background: var(--accent-soft); color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 76px; background: var(--fg); color: var(--page);
  padding: 9px 16px; border-radius: 12px; font-size: 13.5px; z-index: 80; pointer-events: none; max-width: min(520px, 92vw); text-align: center; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.search { position: relative; flex: 1; min-width: 140px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 32px 8px 12px; }
.search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; color: var(--muted); width: 26px; height: 26px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tagchip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
button.tagchip:hover { border-color: var(--accent); }
.tagchip .x { border: 0; background: none; color: var(--muted); padding: 0 0 0 4px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; user-select: none; }
.toggle input { appearance: none; width: 32px; height: 18px; border-radius: 99px; background: var(--line); position: relative; margin: 0; flex: none; cursor: pointer; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 16px; }
select.plain { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 8px; font-size: 13.5px; }
h3.sec { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }

/* ---------- stage: phone frame or full desktop ---------- */
.stage { min-height: 100vh; padding-bottom: 62px; }
.frame { position: relative; background: var(--page); overflow: hidden; }
.stage.desktop .frame { width: 100%; height: calc(100vh - 62px); }
.stage.phone .frame { width: 390px; max-width: 100%; height: min(820px, calc(100vh - 92px)); margin: 16px auto 0; border: 9px solid #0E1418; border-radius: 34px; }
@media (max-width: 500px) { .stage.phone .frame { border: 0; border-radius: 0; margin: 0; height: calc(100vh - 62px); } }
.app { position: absolute; inset: 0; display: flex; min-width: 0; }
.col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.hdr { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--page); min-height: 56px; flex: none; }
.hdr h1 { margin: 0; font-size: 18px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pad { padding: 14px 16px; }
.narrow .pad { padding: 12px 14px; }
.maxw { max-width: 820px; margin: 0 auto; }

/* ---------- covers ---------- */
.cover { flex: none; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 4px; object-fit: cover;
  box-shadow: 0 1px 2px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.06); background: var(--surface); }
.cover.tpl { background: hsl(var(--h) 32% 90%); color: hsl(var(--h) 40% 30%); }
:root[data-theme="dark"] .cover.tpl { background: hsl(var(--h) 22% 22%); color: hsl(var(--h) 45% 75%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cover.tpl { background: hsl(var(--h) 22% 22%); color: hsl(var(--h) 45% 75%); } }
.cover.xs { width: 30px; height: 44px; }
.cover.s { width: 40px; height: 58px; }
.cover.m { width: 76px; height: 112px; border-radius: 5px; }
.cover.l { width: 100px; height: 148px; border-radius: 6px; }
.cover .ct { font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.cover.click { cursor: pointer; }
.coverwrap { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: none; }
.coverwrap .ghost { font-size: 12px; padding: 2px 4px; }

/* ---------- source rows ---------- */
.srow { width: 100%; text-align: left; border: 0; background: none; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: baseline; }
.srow .cover { grid-row: 1 / span 2; align-self: center; }
.srow:hover, .srow[aria-current="true"] { background: var(--accent-soft); }
.srow .t { font-weight: 600; min-width: 0; }
.srow .m { grid-column: 2; font-size: 13px; color: var(--muted); }
.srow .r { grid-row: 1 / span 2; grid-column: 3; text-align: right; font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.secrow { width: 100%; text-align: left; border: 0; background: var(--page); display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; border-bottom: 1px solid var(--line); }

/* ---------- date filter ---------- */
.dfbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dfpanel { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.yf { display: inline-flex; align-items: center; gap: 4px; }
.yf input { width: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; background: var(--page); font-family: var(--font-mono); font-size: 13.5px; }
.calchip { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 99px; font-size: 12px; padding: 2px 9px; font-weight: 600; }
.dfhint { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }

/* ---------- source page ---------- */
.shead { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.shead .top { display: flex; gap: 14px; align-items: flex-start; }
.shead .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.shead .r1 { display: flex; align-items: center; gap: 8px; }
.stitle { font-family: var(--font-quote); font-size: 22px; font-weight: 600; margin: 0; line-height: 1.25; }
.narrow .stitle { font-size: 19px; }
.smeta { font-size: 13.5px; color: var(--muted); }
.shead .r2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.status { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; font-size: 12px; padding: 2px 10px; }
.status.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.editbar { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.nrow { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; transition: background .6s; }
.narrow .nrow { grid-template-columns: 70px 1fr; }
.nrow:hover { background: var(--accent-soft); }
.nrow.flash { background: var(--mark); transition: none; }
.nrow .lc { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.nrow .ex { font-family: var(--font-quote); font-size: 15.5px; }
.nrow .co { color: var(--comment); font-size: 13.5px; }
.nrow .co::before { content: "↳ "; color: var(--muted); }
.nrow .nt { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
.nrow .untag { font-style: italic; opacity: .8; }
.nrow .newmark { color: var(--warn); font-weight: 600; }
.write { position: sticky; bottom: 0; background: var(--page); border-top: 1px solid var(--line); padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.write .wtop { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.locchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 4px 2px 10px; font-size: 12px; color: var(--muted); }
.locchip input { border: 0; background: none; width: 90px; font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); padding: 2px 0; }
.write .wrow { display: flex; gap: 8px; align-items: flex-end; }
.write textarea { flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; resize: none; background: var(--surface); }
.write textarea.ex { font-family: var(--font-quote); font-size: 16px; background: var(--excerpt); }
.srcpick { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.srcpick select { flex: 1; min-width: 0; }

/* ---------- collection / tag view (#12 C) ---------- */
.cbar { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.cbar .r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ctitle { font-size: 20px; font-weight: 600; flex: 1; min-width: 0; margin: 0; }
.count { font-size: 13px; color: var(--muted); white-space: nowrap; }
.gh { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--page); padding: 12px 16px 6px; display: flex; gap: 8px; align-items: baseline; }
.gh:hover .tt { text-decoration: underline; }
.gh .tt { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gh .y { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.reason .src { color: var(--warn); }

/* ---------- lists: tags, collections, todo, search ---------- */
.lrow { width: 100%; text-align: left; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.lrow:hover, .lrow[aria-current="true"] { background: var(--accent-soft); }
.lrow .t { flex: 1; min-width: 0; }
.lrow .t b { font-weight: 600; }
.lrow .s { display: block; font-size: 12.5px; color: var(--muted); }
.lrow .n { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.lrow .more { color: var(--muted); }
.res { width: 100%; text-align: left; border: 0; background: none; display: block; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.res:hover { background: var(--accent-soft); }
.res .snip { font-size: 14px; }
.res .snip.ex { font-family: var(--font-quote); font-size: 15px; }
.res .meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.res .meta .lc { font-family: var(--font-mono); }
.ghead { padding: 14px 16px 6px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
.hint { padding: 20px 16px; color: var(--muted); font-size: 14px; }
.hint code { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }

/* ---------- variant A: tabs ---------- */
.va .rail { width: 92px; flex: none; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 14px 8px; }
.va .rail .brand { font-weight: 600; font-size: 13px; text-align: center; margin-bottom: 14px; color: var(--accent); }
.tabbtn { position: relative; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; font-size: 11px; min-width: 0; color: var(--muted); }
.tabbtn[aria-current="true"] { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.tabbtn .badge { position: absolute; top: 3px; right: calc(50% - 22px); background: var(--warn); color: var(--surface); font-size: 10px; font-weight: 600; border-radius: 99px; padding: 0 5px; line-height: 15px; }
.va .tabbar { display: flex; border-top: 1px solid var(--line); background: var(--surface); padding: 4px 4px 6px; flex: none; }
.va .tabbar .tabbtn { flex: 1; }
.hero { margin: 14px 16px 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 14px; display: flex; gap: 14px; }
.hero .b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.hero .t { font-family: var(--font-quote); font-size: 19px; font-weight: 600; line-height: 1.25; }
.hero .last { font-size: 13.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero .last.ex { font-family: var(--font-quote); font-size: 14.5px; color: var(--fg); }
.hero .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
.homesec { display: flex; align-items: center; gap: 8px; padding: 18px 16px 8px; border-bottom: 1px solid var(--line); }
.homesec h3 { flex: 1; }
.todoband { margin: 12px 16px 4px; width: calc(100% - 32px); text-align: left; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.todoband .t { flex: 1; }
.todoband b { display: block; }
.todoband span { font-size: 12.5px; }

/* ---------- variant B: hub ---------- */
.vb .homehdr { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: var(--page); flex: none; }
.vb .homehdr .brand { display: flex; align-items: baseline; gap: 8px; }
.vb .homehdr h1 { margin: 0; font-size: 22px; flex: 1; }
.vb .homehdr .search input { padding: 10px 34px 10px 14px; border-radius: 12px; font-size: 15.5px; }
.vb .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; max-width: 1180px; margin: 0 auto; padding: 0 12px 100px; }
.narrow.vb .grid { grid-template-columns: 1fr; padding: 0 0 100px; }
.vb .sect { padding-top: 18px; min-width: 0; }
.vb .sect > h3 { padding: 0 16px 8px; }
.vb .sect .all { padding: 8px 16px; }
.cards { display: flex; gap: 10px; overflow-x: auto; padding: 2px 16px 6px; scroll-snap-type: x mandatory; }
.wide.vb .cards { flex-wrap: wrap; overflow: visible; }
.card { flex: none; width: 200px; scroll-snap-align: start; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .f { display: flex; gap: 6px; align-items: center; margin-top: auto; padding-top: 4px; }
.cloud { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 0 16px; align-items: baseline; }
.cloud button { border: 0; background: none; color: var(--accent); padding: 2px 4px; border-radius: 6px; }

// ---------- rules ----------
// Tag identity (#3): Turkish case + spacing fold only.
const tagKey = (t) => t.trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
const hasTag = (list, t) => list.some((x) => tagKey(x) === tagKey(t));
// Search fold (ADR-0005, simplified): Turkish case, İ/I/ı→i, diacritics off, ayn/hemze/apostrophe deleted, final b/d→p/t.
const fold = (s) => s.toLocaleLowerCase("tr").replace(/[ʿʾ'’]/g, "").replace(/ı/g, "i").normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/b\b/g, "p").replace(/d\b/g, "t");

function parseQuery(q) {
  const toks = q.trim().split(/\s+/).filter(Boolean);

    pos: toks.filter((t) => !t.startsWith("-")).flatMap(words),
    neg: toks.filter((t) => t.startsWith("-") && t.length > 1).flatMap((t) => words(t.slice(1))),
  };
}
// Prefix also tries the query's unfolded ending, so "naib" (folded "naip") still finds "naiblik".
const prefixHit = (w, q) => q.length >= 3 && (w.startsWith(q) || w.startsWith(q.replace(/p$/, "b").replace(/t$/, "d")));
const wordHit = (w, q) => w === q || prefixHit(w, q);
// Note match (#16 without the stem tier): every word exact (1) or 3+ letter prefix (3); -word excludes. Excerpt/Comment only.
function noteMatch(n, pq) {
  if (!pq.pos.length && !pq.neg.length) return null;
  const exW = words(n.ex), coW = words(n.co), all = [...exW, ...coW];
  if (pq.neg.some((q) => all.some((w) => wordHit(w, q)))) return null;
  let tier = 1;
  for (const q of pq.pos) {
    if (all.includes(q)) continue;
    if (all.some((w) => prefixHit(w, q))) { tier = 3; continue; }
    return null;
  }
  if (!pq.pos.length) return null;
  return { tier, field: pq.pos.some((q) => exW.some((w) => wordHit(w, q))) ? "ex" : "co" };

// Source match: Başlık, Yazar, Künye notu; plus 3+ letter part inside a word (nalcık → İnalcık).
function sourceMatch(s, pq) {
  if (!pq.pos.length) return null;
  const text = [s.author, s.title, s.note || ""].join(" ");
  const ws = words(text), f = fold(text);
  let tier = 1;
  for (const q of pq.pos) {
    if (ws.includes(q)) continue;
    if (ws.some((w) => prefixHit(w, q))) { tier = Math.max(tier, 3); continue; }
    if (q.length >= 3 && f.includes(q)) { tier = 4; continue; }
    return null;
  }
  if (pq.neg.some((q) => ws.some((w) => wordHit(w, q)))) return null;
  return { tier };
}
// Locator order (#2): empty first, then by the numbers in the text, number-less last in capture order.
function locKey(n) {

  return nums.length ? [1, ...nums] : [2, n.at];
}
function cmpArr(a, b) {
  for (let i = 0; i < Math.max(a.length, b.length); i++) {
    const x = a[i] ?? -1, y = b[i] ?? -1;
    if (x !== y) return x - y;
  }
  return 0;
}
const byLoc = (a, b) => cmpArr(locKey(a), locKey(b));
// Source order by Date (#3): undated last, alphabetical.
function cmpDate(a, b) {
  if (a.sort == null && b.sort != null) return 1;
  if (b.sort == null && a.sort != null) return -1;
  if (a.sort != null && a.sort !== b.sort) return a.sort - b.sort;
  return (a.author + a.title).localeCompare(b.author + b.title, "tr");

const shortName = (s) => join(s.author, s.title);

function relTime(at) {
  const h = (Date.now() - at) / HOUR;
  if (h < 1) return "az önce";
  if (h < 24) return `${Math.floor(h)} saat önce`;
  if (h < 48) return "dün";
  if (h < 24 * 14) return `${Math.floor(h / 24)} gün önce`;
  return `${Math.floor(h / 24 / 7)} hafta önce`;
}

// Everything the screens derive from the library.
function derive(sources, notes, colls) {
  const src = Object.fromEntries(sources.map((s) => [s.id, s]));
  const bySrc = {};
  for (const n of notes) (bySrc[n.src] ||= []).push(n);
  const info = {};
  for (const s of sources) {
    const ns = bySrc[s.id] || [];
    const fresh = ns.filter((n) => !n.tags.length && (s.passAt == null || n.at > s.passAt));
    info[s.id] = { count: ns.length, last: ns.length ? Math.max(...ns.map((n) => n.at)) : 0, untagged: fresh.length, fresh: new Set(fresh.map((n) => n.id)) };
  }
  // Düzenlenecekler (#13): sources with untagged notes captured after the last "Bitir"; finished first, then by last note.
  const todo = sources.filter((s) => info[s.id].untagged > 0)
    .sort((a, b) => (a.status === "bitti" ? 0 : 1) - (b.status === "bitti" ? 0 : 1) || info[b.id].last - info[a.id].last);
  const tagMap = new Map();
  const bump = (t, k, at = 0) => { const key = tagKey(t); const e = tagMap.get(key) || { name: t, notes: 0, sources: 0, last: 0 }; e[k]++; e.last = Math.max(e.last, at); tagMap.set(key, e); };
  notes.forEach((n) => n.tags.forEach((t) => bump(t, "notes", n.at)));
  sources.forEach((s) => s.tags.forEach((t) => bump(t, "sources")));
  const tags = [...tagMap.values()].sort((a, b) => a.name.localeCompare(b.name, "tr"));
  const reading = sources.filter((s) => s.status === "okunuyor").sort((a, b) => info[b.id].last - info[a.id].last);
  return { sources, notes, colls, src, bySrc, info, todo, tags, reading };
}

// Collection membership (ADR-0003): own tag OR (option on AND source tag).
function computeColl(S, tags, includeSources, query) {
  const pq = parseQuery(query);
  const members = [];
  let wouldAdd = 0;
  for (const n of S.notes) {
    const s = S.src[n.src];
    const own = n.tags.filter((t) => hasTag(tags, t));
    const via = s.tags.filter((t) => hasTag(tags, t));
    if (!own.length && via.length && !includeSources) wouldAdd++;
    if (!own.length && !(includeSources && via.length)) continue;
    members.push({ ...n, own, via: includeSources ? via : [] });
  }
  const visible = members.filter((n) => !query.trim() || noteMatch(n, pq));
  const groups = [];
  for (const s of [...S.sources].sort(cmpDate)) {
    const ns = visible.filter((n) => n.src === s.id).sort(byLoc);
    if (ns.length) groups.push({ source: s, notes: ns });
  }
  return { groups, total: members.length, shown: visible.length, viaOnly: members.filter((n) => !n.own.length).length, wouldAdd, pq };
}

// ---------- Tarih filter: calendar chip as in the Source form (#18) ----------
const CALS = [{ k: "M", name: "Milâdî", suf: "" }, { k: "H", name: "Hicrî", suf: " h." }, { k: "R", name: "Rumî", suf: " r." }];
// Approximate start of a year in Milâdî, enough for filtering (#17 has the exact rules).
const toMil = (y, cal) => cal === "H" ? y * 0.970229 + 621.5643 : cal === "R" ? y + 584.17 : y;
const dfActive = (f) => !!(f && (f.from.y || f.to.y));
function inRange(s, f) {
  if (!dfActive(f)) return true;
  if (s.sort == null) return false;
  const lo = f.from.y ? toMil(+f.from.y, f.from.cal) : -Infinity;
  const hi = f.to.y ? toMil(+f.to.y + 1, f.to.cal) : Infinity;
  return s.sort >= lo && s.sort < hi;
}
const yLabel = (p) => p.y ? p.y + CALS.find((c) => c.k === p.cal).suf : "…";
const EMPTY_DF = { from: { y: "", cal: "M" }, to: { y: "", cal: "M" } };

function DateFilter({ value, onChange, open, setOpen }) {
  const f = value || EMPTY_DF;
  const set = (side, patch) => onChange({ ...f, [side]: { ...f[side], ...patch } });
  const cycle = (side) => { const i = CALS.findIndex((c) => c.k === f[side].cal); set(side, { cal: CALS[(i + 1) % 3].k }); };
  const lo = f.from.y ? Math.floor(toMil(+f.from.y, f.from.cal)) : null;
  const hi = f.to.y ? Math.floor(toMil(+f.to.y + 1, f.to.cal) - 0.01) : null;
  const field = (side, lab) => html`<span className="yf"><span className="muted" style=${{ fontSize: 12.5 }}>${lab}</span>
    <input inputMode="numeric" placeholder="yıl" value=${f[side].y} onChange=${(e) => set(side, { y: e.target.value.replace(/\D/g, "").slice(0, 4) })} />
    <button className="calchip" onClick=${() => cycle(side)} title="Takvimi değiştir">${CALS.find((c) => c.k === f[side].cal).name}</button></span>`;
  return html`<button className="secondary dfbtn" aria-pressed=${dfActive(f)} onClick=${() => setOpen(!open)}>
      Tarih: ${dfActive(f) ? `${yLabel(f.from)} – ${yLabel(f.to)}` : "tümü"} ▾</button>
    ${open ? html`<div className="dfpanel">
      ${field("from", "Başlangıç")} ${field("to", "Bitiş")}
      ${dfActive(f) ? html`<button className="ghost" onClick=${() => onChange(EMPTY_DF)}>Temizle</button>` : null}
      <div className="dfhint">${dfActive(f) ? `≈ ${lo ?? "…"}–${hi ?? "…"} Milâdî. Kaynaklar Tarih'lerinin yaklaşık Milâdî değeriyle süzülür; tarihsiz kaynaklar gizlenir.` : "Kaynak Tarih'ine göre süz. Takvim çipine dokun: Milâdî → Hicrî → Rumî."}</div>
    </div>` : null}`;
}

function Hl({ text, pq }) {
  if (!pq || !pq.pos.length) return text;
  return text.split(/(\s+)/).map((tok, i) => {
    const ws = words(tok);
    return ws.length && ws.some((w) => pq.pos.some((q) => wordHit(w, q))) ? html`<mark key=${i}>${tok}</mark>` : tok;
  });
}

function TodoBody({ S, go, activeId }) {

        <span className="s">${[s.author, `son not ${relTime(S.info[s.id].last)}`].filter(Boolean).join(" · ")}</span></span>
      ${s.status === "bitti" ? html`<span className="pill done">bitti</span>` : null}
      <span className="pill warn">${S.info[s.id].untagged} etiketsiz</span>
    </button>`)}

function snippet(text, pq) {
  const ws = text.split(/(\s+)/);
  const i = ws.findIndex((w) => words(w).some((x) => pq.pos.some((q) => wordHit(x, q))));
  if (text.length <= 150 || i < 0) return text;
  const start = Math.max(0, i - 12);
  return (start ? "…" : "") + ws.slice(start, start + 40).join("") + (start + 40 < ws.length ? "…" : "");
}

// Search results (#16): two groups, Notes and Sources; tiers then newest. Tarih filter by the source's date.
function SearchBody({ S, q, go }) {
  const [kind, setKind] = useState("all");
  const [df, setDf] = useState(EMPTY_DF);
  const [dfOpen, setDfOpen] = useState(false);
  const pq = parseQuery(q);
  if (!q.trim()) return html`<div className="hint">
    Notların Alıntı ve Yorum'unda, kaynakların Başlık, Yazar ve Künye notunda arar.<br/><br/>
    <code>"tırnak"</code> kesin arama · <code>-kelime</code> hariç tutar · Locator, etiket ve Tarih aranmaz; Tarih için sonuçlarda süzgeç var.
  </div>`;
  const srcRes = S.sources.filter((s) => inRange(s, df)).map((s) => ({ s, m: sourceMatch(s, pq) })).filter((x) => x.m)
    .sort((a, b) => a.m.tier - b.m.tier || S.info[b.s.id].last - S.info[a.s.id].last);
  const noteRes = S.notes.filter((n) => inRange(S.src[n.src], df)).map((n) => ({ n, m: noteMatch(n, pq) })).filter((x) => x.m)
    .sort((a, b) => a.m.tier - b.m.tier || b.n.at - a.n.at);
  const showS = kind !== "notes", showN = kind !== "sources";
  return html`<div>
    <div className="ctl">
      <div className="seg">
        <button aria-pressed=${kind === "all"} onClick=${() => setKind("all")}>Tümü</button>
        <button aria-pressed=${kind === "notes"} onClick=${() => setKind("notes")}>Notlar ${noteRes.length}</button>
        <button aria-pressed=${kind === "sources"} onClick=${() => setKind("sources")}>Kaynaklar ${srcRes.length}</button>
      </div>
      <${DateFilter} value=${df} onChange=${setDf} open=${dfOpen} setOpen=${setDfOpen} />
    </div>
    ${showS && srcRes.length ? html`<div className="ghead"><h3 className="sec">Kaynaklar · ${srcRes.length}</h3></div>
      ${(kind === "all" ? srcRes.slice(0, 3) : srcRes).map(({ s }) => html`<${SourceRow} key=${s.id} S=${S} s=${s} pq=${pq} onClick=${() => go({ r: "source", id: s.id })} />`)}
      ${kind === "all" && srcRes.length > 3 ? html`<button className="ghost" style=${{ margin: "6px 12px" }} onClick=${() => setKind("sources")}>Tüm kaynaklar (${srcRes.length})</button>` : null}` : null}
    ${showN && noteRes.length ? html`<div className="ghead"><h3 className="sec">Notlar · ${noteRes.length}</h3></div>
      ${noteRes.map(({ n, m }) => { const s = S.src[n.src]; return html`<button key=${n.id} className="res" onClick=${() => go({ r: "source", id: s.id, focus: n.id })}>
        <div className=${"snip " + m.field}>${m.field === "co" ? html`<span className="muted">↳ </span>` : null}<${Hl} text=${snippet(m.field === "ex" ? n.ex : n.co, pq)} pq=${pq} /></div>
        <div className="meta">${shortName(s)} · <span className="lc">${n.loc || "konumsuz"}</span>${m.field === "co" ? " · yorumdan" : ""}</div>
      </button>`; })}` : null}
    ${!srcRes.length && !noteRes.length ? html`<div className="empty">Sonuç yok.</div>` : null}
  </div>`;
}

    onSave=${() => { const id = S.saveColl(sec.tags); pick({ k: "coll", id }); }} />`;
  const wideList = ["coll", "tags", "search"].includes(sec.k);
  const detailView = detail ? html`<${SourceBody} S=${S} id=${detail.id} focus=${detail.focus} order="toggle" write go=${go} narrowHead=${narrow} />` : null;

  if (narrow) return html`<div className="app vc narrow">
    <div className="col">
      <header className="hdr">
        ${detail ? html`<button className="iconbtn" onClick=${() => setDetail(null)} aria-label="Geri">‹</button>`
          : html`<button className="iconbtn" onClick=${() => setDrawer(true)} aria-label="Menü">☰</button>`}
        <h1>${detail ? S.src[detail.id].title : sec.k === "coll" ? S.colls.find((c) => c.id === sec.id).name : listTitle}</h1>
      </header>
      <div className="scroll"><div style=${{ minHeight: "100%", display: "flex", flexDirection: "column" }}>${detail ? detailView : list}</div></div>
    </div>
    ${drawer ? html`<div className="drawer-bg" onClick=${() => setDrawer(false)}></div><div className="drawer">${sidebar}</div>` : null}
  </div>`;

  return html`<div className="app vc wide">
    ${sidebar}
    <div className="listpane" style=${{ width: wideList ? (detail ? "46%" : "auto") : 400, flex: wideList && !detail ? 1 : "none" }}>
      ${wideList ? null : html`<div className="lhdr"><h2>${listTitle}</h2></div>`}
      <div className="scroll">${list}</div>
    </div>
    ${!wideList || detail ? html`<div className="detail">
      ${detail && wideList ? html`<div className="lhdr"><button className="iconbtn" onClick=${() => setDetail(null)} aria-label="Kapat">×</button><h2>Kaynak</h2></div>` : null}
      <div className="scroll"><div style=${{ minHeight: "100%", display: "flex", flexDirection: "column" }}>${detailView || html`<div className="empty" style=${{ marginTop: 80 }}>Bir kaynak seç.</div>`}</div></div>
    </div>` : null}
  </div>`;
}

// ---------- prototype chrome ----------
function Switcher({ variant, setVariant, device, setDevice, showState, setShowState }) {
  const i = VARIANTS.findIndex((v) => v.key === variant);
  const go = (d) => setVariant(VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length].key);
  useEffect(() => {
    const onKey = (e) => {
      const el = document.activeElement;
      if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable)) return;
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
  return html`<nav className="switcher" aria-label="Varyant">
    <button onClick=${() => go(-1)} aria-label="Önceki varyant">‹</button>
    <span className="lab"><b>${variant}</b><span className="full"> · ${VARIANTS[i].name}</span></span>
    <button onClick=${() => go(1)} aria-label="Sonraki varyant">›</button>
    <button className="txt" onClick=${() => setDevice(device === "phone" ? "desktop" : "phone")}>${device === "phone" ? "telefon" : "masaüstü"}</button>
    <button className="txt" aria-pressed=${showState} onClick=${() => setShowState(!showState)}>durum</button>
  </nav>`;
}
function setParam(name, v) {
  const u = new URL(location.href);
  u.searchParams.set(name, v);
  history.replaceState(null, "", u);
}

function App() {
  const params = new URLSearchParams(location.search);
  const [variant, setVariantS] = useState(() => { const v = (params.get("variant") || "").toUpperCase(); return VARIANTS.some((x) => x.key === v) ? v : "A"; });
  const [device, setDeviceS] = useState(() => { const d = params.get("device"); return d === "phone" || d === "desktop" ? d : innerWidth < 720 ? "phone" : "desktop"; });
  const [winW, setWinW] = useState(innerWidth);
  useEffect(() => { const f = () => setWinW(innerWidth); addEventListener("resize", f); return () => removeEventListener("resize", f); }, []);
  const [sources, setSources] = useState(SEED_SOURCES);
  const [notes, setNotes] = useState(SEED_NOTES);
  const [colls, setColls] = useState(SEED_COLLS);
  const [toast, setToast] = useState(null);
  const [showState, setShowState] = useState(false);
  const [nav, setNav] = useState({});
  const toastT = useRef();
  const narrow = device === "phone" || winW < 720;
  const setVariant = (v) => { setVariantS(v); setParam("variant", v); };
  const setDevice = (d) => { setDeviceS(d); setParam("device", d); };

  const D = useMemo(() => derive(sources, notes, colls), [sources, notes, colls]);
  const flash = (t) => { setToast(t); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToast(null), 2600); };
  const S = {
    ...D, flash,
    addNote: (src, n) => { const id = "n" + Date.now(); setNotes((ns) => [...ns, { id, src, tags: [], at: Date.now(), ...n }]); return id; },
    setStatus: (id, status) => {
      setSources((ss) => ss.map((s) => s.id === id ? { ...s, status } : s));
      if (status === "bitti" && D.info[id].untagged) flash(`${D.info[id].untagged} etiketsiz not var. Şimdi düzenle · Sonra (#13)`);
    },
    finishPass: (id) => { setSources((ss) => ss.map((s) => s.id === id ? { ...s, passAt: Date.now() } : s)); flash("Bitir: kaynak Düzenlenecekler'den düştü"); },
    saveColl: (tags) => { const id = "c" + Date.now(); setColls((cs) => [...cs, { id, name: tags.join(" · "), tags, includeSources: true }]); flash("Dosya kaydedildi; adı değiştirilebilir"); return id; },
    setCover: (id, cover) => { setSources((ss) => ss.map((s) => s.id === id ? { ...s, cover } : s)); if (cover) flash("Kapak eklendi"); },
    updateColl: (id, patch) => setColls((cs) => cs.map((c) => c.id === id ? { ...c, ...patch } : c)),
  };
  const V = { A: VariantA, B: VariantB, C: VariantC }[variant];
  const state = {
    varyant: `${variant} · ${VARIANTS.find((v) => v.key === variant).name}`,
    cihaz: narrow ? "telefon" : "masaüstü",
    ...nav,
    düzenlenecekler: D.todo.map((s) => `${s.title} (${D.info[s.id].untagged}${s.status === "bitti" ? ", bitti" : ""})`),
    kütüphane: `${sources.length} kaynak · ${notes.length} not · ${D.tags.length} etiket · ${colls.length} dosya`,
  };
  return html`<div className=${"stage " + (device === "phone" ? "phone" : "desktop")}>
    <div className="frame"><${V} key=${variant} S=${S} narrow=${narrow} report=${setNav} /></div>
    <${Switcher} variant=${variant} setVariant=${setVariant} device=${device} setDevice=${setDevice} showState=${showState} setShowState=${setShowState} />
    ${showState ? html`<div className="statepanel">${JSON.stringify(state, null, 2)}</div>` : null}
    ${toast ? html`<div className="toast">${toast}</div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
