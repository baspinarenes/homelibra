name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint:boundaries
      - run: pnpm lint
      - name: core tests
        run: pnpm --filter @homelibra/core test
      - name: outbox tests
        run: pnpm --filter @homelibra/outbox test

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Service containers start before any step, so they cannot use an image
      # built in this job. Our own image (infra/postgres) is built and run here
      # instead, so the tests always meet the database that production runs.
      # The container lives for this job only; its passwords are random per run.
      - name: Generate database passwords
        run: |
          for name in POSTGRES_PASSWORD HOMELIBRA_OWNER_PASSWORD HOMELIBRA_APP_PASSWORD; do
            pw=$(openssl rand -hex 16)
            echo "::add-mask::$pw"
            echo "$name=$pw" >> "$GITHUB_ENV"
          done
      - name: Start our Postgres image
        run: |
          docker build -t homelibra-postgres infra/postgres
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD -e HOMELIBRA_OWNER_PASSWORD -e HOMELIBRA_APP_PASSWORD \
            -e HOMELIBRA_DATABASES=homelibra_test \
            homelibra-postgres
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d homelibra_test && exit 0
            sleep 1
          done
          docker logs postgres; exit 1
      - name: API integration tests
        run: pnpm --filter @homelibra/api test
        env:
          TEST_DATABASE_URL: postgres://homelibra_app:${{ env.HOMELIBRA_APP_PASSWORD }}@localhost:5432/homelibra_test
          TEST_MIGRATION_DATABASE_URL: postgres://homelibra_owner:${{ env.HOMELIBRA_OWNER_PASSWORD }}@localhost:5432/homelibra_test

  # On main, after the checks: the images Coolify runs (#42), in the private
  # GHCR under `main` (what Coolify pulls) and `sha-<commit>` (to roll back).
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, api]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: homelibra-api
            context: .
            file: apps/api/Dockerfile
            coolify: COOLIFY_API_UUID
          - image: homelibra-web
            context: .
            file: apps/app/Dockerfile
            coolify: COOLIFY_WEB_UUID
          # The database is not redeployed on push; Coolify takes a new tag
          # of it only when the Operator changes its Image field.
          - image: homelibra-postgres
            context: infra/postgres
            file: infra/postgres/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          build-args: SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:main
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Coolify's deploy API pulls the new `main` image. Until the Operator
      # sets COOLIFY_URL, COOLIFY_TOKEN and the resource's UUID, deploy by
      # hand from the Coolify panel.
      - name: Deploy on Coolify
        if: matrix.coolify
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          UUID: ${{ vars[matrix.coolify] }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_TOKEN" ] || [ -z "$UUID" ]; then
            echo "::notice::Coolify is not configured; deploy ${{ matrix.image }} from the panel."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_URL/api/v1/deploy?uuid=$UUID"
